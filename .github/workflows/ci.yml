name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install ripgrep
        # The pi SDK's grep/find tools shell out to `rg`; when it is missing they
        # try to download a binary, and one runner failed that download, turning
        # CI red for an unrelated commit. The runner image does not ship
        # ripgrep, so install it and make the dependency deterministic.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck + lint + format
        run: npm run check

      - name: Integration tests
        # Loops every tests/test-*.ts. The runner skips test-docker
        # (long Docker image build, run locally before releases) and
        # the live-LLM gated branches inside test-session/sse/api skip
        # themselves because PI_TEST_LIVE_PROMPT isn't set. Native
        # ubuntu-latest provides node-pty/ripgrep/git out of the box —
        # no extra setup needed.
        run: npm run test:ci
